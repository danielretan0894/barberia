<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambio Obligatorio de Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 350px;">
        <h3 class="text-center mb-3">Cambio de Contraseña</h3>
        <p class="text-muted small text-center">Por seguridad, al ser tu primer ingreso debes cambiar tu contraseña (mínimo 8 caracteres).</p>
        
        {% if error %}
            <div class="alert alert-danger p-2 small">{{ error }}</div>
        {% endif %}
        
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nueva Contraseña</label>
                <input type="password" name="nueva_password" class="form-control" minlength="8" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirmar Contraseña</label>
                <input type="password" name="confirmar_password" class="form-control" minlength="8" required>
            </div>
            <button type="submit" class="w-100 btn btn-primary">Actualizar Contraseña</button>
        </form>
    </div>
</body>
</html>
