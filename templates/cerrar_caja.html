<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cierre de Turno y Arqueo de Caja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-lg p-4 rounded-4 bg-white" style="width: 450px;">
        <div class="text-center mb-3">
            <i class="fas fa-calculator text-danger fa-3x mb-2"></i>
            <h4 class="fw-bold text-dark">Cierre de Turno y Arqueo</h4>
            <p class="text-muted small">Sucursal: <strong>{{ negocio }}</strong></p>
        </div>

        <div class="alert alert-secondary py-2 small mb-3">
            <div class="d-flex justify-content-between">
                <span>Fondo inicial:</span>
                <strong>${{ "%.2f"|format(fondo) }}</strong>
            </div>
            <div class="d-flex justify-content-between">
                <span>Efectivo teórico en sistema:</span>
                <strong>${{ "%.2f"|format(teorico) }}</strong>
            </div>
        </div>

        <p class="small text-muted">Cuenta físicamente el dinero en efectivo que tienes en la gaveta e ingrésalo a continuación:</p>

        <form action="/arqueo_caja" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">Efectivo Real en Gaveta ($):</label>
                <input type="number" step="0.01" name="efectivo_real" class="form-control form-control-lg text-success fw-bold" required placeholder="0.00" autofocus autocomplete="off">
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">Notas u Observaciones:</label>
                <textarea name="notas_arqueo" class="form-control" rows="2" placeholder="Ej. Turno matutino sin novedades..."></textarea>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a href="/pos" class="btn btn-secondary btn-sm px-4 fw-bold">Cancelar</a>
                <button type="submit" class="btn btn-danger btn-sm px-4 fw-bold shadow-sm">Confirmar Cierre</button>
            </div>
        </form>
    </div>
</body>
</html>
