<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ticket de Venta</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; width: 280px; margin: 0 auto; padding: 10px; color: #000; }
        .center { text-align: center; }
        .line { border-bottom: 1px dashed #000; margin: 10px 0; }
        .flex { display: flex; justify-content: space-between; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body onload="window.print()">
    <div class="center">
        <h3>{{ negocio }}</h3>
        <p style="font-size: 0.8rem; margin: 2px 0;">Comprobante de Venta</p>
        <p style="font-size: 0.75rem; margin: 2px 0;">{{ venta[0] }}</p>
    </div>
    <div class="line"></div>
    <p style="font-size: 0.85rem;"><strong>Detalle:</strong><br>{{ venta[1] }}</p>
    <div class="line"></div>
    <div class="flex">
        <span>Método:</span>
        <span><strong>{{ venta[3] }}</strong></span>
    </div>
    <div class="flex" style="font-size: 1.1rem; margin-top: 5px;">
        <span>TOTAL:</span>
        <span><strong>${{ "%.2f"|format(venta[2]) }}</strong></span>
    </div>
    <div class="line"></div>
    <div class="center" style="font-size: 0.8rem;">
        <p>¡Gracias por su preferencia!</p>
    </div>
    <div class="center no-print" style="margin-top: 15px;">
        <button onclick="window.print()" style="padding: 5px 10px; cursor: pointer;">Imprimir de nuevo</button>
        <br><br>
        <a href="/pos" style="color: blue;">Regresar al POS</a>
    </div>
</body>
</html>
