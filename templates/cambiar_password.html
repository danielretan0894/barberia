<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Pro - Cambio Obligatorio de Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #1a1d20; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-login { width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="card-login">
        <div class="text-center mb-4">
            <i class="fas fa-lock text-primary fa-3x mb-2"></i>
            <h4 class="fw-bold text-dark">Nueva Contraseña</h4>
            <p class="text-muted small">Por seguridad, es tu primer inicio de sesión. Ingresa una clave de al menos 8 dígitos.</p>
        </div>

        {% if error %}
            <div class="alert alert-danger p-2 text-center small" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form action="/forzar_cambio_password" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Nueva Contraseña (Mínimo 8 caracteres):</label>
                <input type="password" name="nueva_password" class="form-control" required minlength="8" placeholder="Mínimo 8 dígitos">
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">Guardar y Continuar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
