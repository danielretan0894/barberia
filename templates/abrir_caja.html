<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Apertura de Caja Diaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow-lg p-4 rounded-4 bg-white" style="width: 400px;">
        <div class="text-center mb-4">
            <i class="fas fa-cash-register text-success fa-3x mb-2"></i>
            <h3 class="fw-bold text-dark">Apertura de Caja</h3>
            <p class="text-muted small">Sucursal: <strong>{{ negocio }}</strong></p>
        </div>

        <p class="small text-muted">Es un nuevo día. Por favor, ingresa el fondo inicial con el que arranca la gaveta de efectivo antes de continuar operando:</p>

        <form action="/abrir_caja_diaria" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">Fondo Inicial en Caja ($):</label>
                <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" step="0.01" name="monto_inicial" class="form-control form-control-lg fw-bold text-success" required placeholder="0.00" autofocus>
                </div>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-success fw-bold py-2 shadow-sm">
                    <i class="fas fa-check-circle me-1"></i> Iniciar Día y Abrir Caja
                </button>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="/logout" class="text-danger small text-decoration-none fw-bold"><i class="fas fa-sign-out-alt me-1"></i> Cerrar Sesión</a>
        </div>
    </div>
</body>
</html>
